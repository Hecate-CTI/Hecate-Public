title: Java Process Spawning Interactive Shell or Binary
id: d7a1b8c2-3e4f-4a5b-9c6d-1a2b3c4d5e6f
status: stable
description: Detects a Java service process (such as Keycloak, Jira, Confluence, or Jenkins) spawning an interactive shell or command interpreter, indicating potential post-exploitation following Java4Shell (CVE-2026-114938) remote code execution.
references:
- https://calif.io/java4shell
- https://www.sysdig.com/blog/java4shell-cve-2026-114938-pre-auth-rce-in-openjdk
author: hecate-runner orchestrator
date: '2026-11-19'
tags:
- attack.execution
- attack.t1059.004
- attack.initial_access
- attack.t1190
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|contains:
    - /java
  selection_child:
    Image|endswith:
    - /bin/sh
    - /bin/bash
    - /bin/dash
    - /bin/zsh
    - /usr/bin/curl
    - /usr/bin/wget
    - /usr/bin/whoami
    - /usr/bin/id
  condition: selection_parent and selection_child
falsepositives:
- Legitimate administrative maintenance scripts executed directly by application management wrappers
level: high
hunt_id: H-0039
