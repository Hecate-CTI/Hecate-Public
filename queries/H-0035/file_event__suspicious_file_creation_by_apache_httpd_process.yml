title: Suspicious File Creation by Apache httpd Process
id: 12077dda-c43b-4ea3-b60c-21e281c74b75
status: experimental
description: Detects executable or webshell file creation by Apache httpd worker processes in web-accessible or temporary directories, indicating potential webshell deployment following CVE-2026-119618 mod_http2 exploitation. Filters benign log and lock files.
references:
- https://github.com/LLCForge/CVE-2026-119618
author: hecate analyst review
date: '2026-11-13'
tags:
- attack.t1190
logsource:
  category: file_event
  product: linux
detection:
  selection_process:
    Image|endswith:
    - /httpd
    - /apache2
  selection_path:
    TargetFilename|contains:
    - /var/www/
    - /usr/share/nginx/html/
    - /srv/http/
    - /tmp/
    - /dev/shm/
  selection_target:
    TargetFilename|endswith:
    - .php
    - .phtml
    - .php5
    - .sh
    - .py
    - .pl
    - .so
    - .elf
  filter_legitimate:
    TargetFilename|endswith:
    - .log
    - .pid
    - .lock
    - .tmp
  condition: selection_process and selection_path and selection_target and not filter_legitimate
falsepositives:
- Legitimate web application file upload features allowing executable scripts
- Content management systems writing plugins or cache updates
level: high
hunt_id: H-0035
hecate_review:
  verdict: pass
  reviewed_by: analyst
  notes: Refined to require webshell and executable script extensions in TargetFilename, filtering routine temporary and log files.
