title: Apache httpd Worker Process Initiating Outbound Network Connection
id: 24eb9e99-e822-4c0e-a9c2-02557cbc00a0
status: experimental
description: Detects outbound network connections initiated by Apache httpd worker processes to non-local IP addresses, indicating potential reverse shells or C2 traffic following CVE-2026-119618 mod_http2 exploitation. Filters loopback and common private network ranges.
references:
- https://github.com/LLCForge/CVE-2026-119618
author: hecate analyst review
date: '2026-11-13'
tags:
- attack.t1190
logsource:
  category: network_connection
  product: linux
detection:
  selection:
    Image|endswith:
    - /httpd
    - /apache2
  filter:
    DestinationIp|startswith:
    - '127.'
    - '::1'
    - '10.'
    - '192.168.'
    - '172.16.'
  condition: selection and not filter
falsepositives:
- Apache httpd configured as a reverse proxy connecting to external backend application servers
level: high
hunt_id: H-0035
hecate_review:
  verdict: pass
  reviewed_by: analyst
  notes: Retained as defense-in-depth network boundary check for post-exploitation reverse shells and C2 communication, filtering loopback and RFC 1918 addresses.
