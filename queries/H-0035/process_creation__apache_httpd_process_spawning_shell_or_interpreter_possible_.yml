title: Apache httpd Worker Process Spawning Shell or Interpreter (Post-Exploitation)
id: a126feb2-8e83-4761-9ac9-c24bceeec0ec
status: experimental
description: Detects Apache httpd or apache2 worker processes spawning shell interpreters or scripting engines following potential exploitation of CVE-2026-119618 (mod_http2 race condition RCE). While exploitation primary indicators involve process crashes and HTTP/2 resets, successful exploitation typically manifests as unexpected child processes spawned by web server workers.
references:
- https://github.com/LLCForge/CVE-2026-119618
author: hecate analyst review
date: '2026-11-13'
tags:
- attack.t1059.004
- attack.t1059.006
- attack.t1190
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|endswith:
    - /httpd
    - /apache2
  selection_child:
    Image|endswith:
    - /bin/sh
    - /bin/bash
    - /bin/dash
    - /bin/zsh
    - /usr/bin/python
    - /usr/bin/python3
    - /usr/bin/perl
    - /usr/bin/ruby
    - /usr/bin/php
  condition: selection_parent and selection_child
falsepositives:
- Legitimate CGI scripts or server-side scripting configurations that spawn interpreters
- Administrative maintenance scripts executed via Apache modules
level: high
hunt_id: H-0035
hecate_review:
  verdict: pass
  reviewed_by: analyst
  notes: Aligned title and description to explicitly identify post-exploitation command execution scope following mod_http2 RCE.
