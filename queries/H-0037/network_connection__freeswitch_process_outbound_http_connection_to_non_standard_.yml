title: FreeSWITCH Process Outbound HTTP Connection to Non-Standard Port
id: fea8e1fe-a64f-4ec5-85e2-31a3d2dc2127
status: experimental
description: Detects outbound HTTP connections from FreeSWITCH process to external endpoints on non-standard
  ports, consistent with CVE-2026-116779 exploitation where the exploit tool exfiltrates command output
  to an attacker-controlled HTTP listener. The SIP2Shell exploit demonstrates out-of-band data exfiltration
  via HTTP on ports such as 8899.
references:
- https://github.com/DeathShotXD/SIP2Shell
author: hecate (auto-generated draft - requires analyst review)
date: '2026-11-15'
tags:
- attack.t1059.006
logsource:
  category: network_connection
  product: linux
detection:
  selection_process:
    Image|endswith: /freeswitch
  selection_port:
    DestinationPort:
    - 8000
    - 8080
    - 8443
    - 8888
    - 8899
    - 9000
    - 9090
    - 9999
  condition: selection_process and selection_port
falsepositives:
- Legitimate FreeSWITCH integrations with external HTTP APIs or webhooks
- FreeSWITCH modules configured to send CDR or event data to external HTTP endpoints
- Administrative scripts using FreeSWITCH ESL to trigger HTTP callbacks
level: high
hunt_id: H-0037
hecate_review:
  verdict: keep
x_hecate_synthetic_holdout_status: failed
