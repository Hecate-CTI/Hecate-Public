title: PHP Web Server Process Spawning Shell Interpreter (Post-Exploitation)
id: 5872f88f-8093-44ab-b691-fab8b897d4f8
status: experimental
description: Detects PHP-FPM or PHP-CGI processes spawning shell interpreters following potential exploitation of CVE-2026-109618 (php2shell) or similar PHP RCE vulnerabilities. This serves as a defense-in-depth detection complementing webserver access log probing queries.
references:
- https://github.com/JoshRob297/php2shell-research
author: hecate analyst review
date: '2026-11-10'
tags:
- attack.t1059.004
- attack.t1190
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    # contains (not endswith): paths like /usr/sbin/php-fpm8.3
    ParentImage|contains:
    - /php-fpm
    - /php-cgi
  selection_child:
    Image|endswith:
    - /bin/sh
    - /bin/bash
    - /bin/dash
    - /bin/zsh
    - /bin/ksh
  condition: selection_parent and selection_child
falsepositives:
- Legitimate PHP applications that execute system commands as part of normal functionality
- Administrative scripts or maintenance tasks triggered through web interfaces
level: high
hunt_id: H-0032
hecate_review:
  verdict: pass
  reviewed_by: analyst
  notes: >-
    Defense-in-depth post-exploitation complement to
    webserver__http_request_to_php2shell_vulnerable_endpoint.yml.
    ParentImage limited to php-fpm/php-cgi (not bare /php) to avoid broad FPs.
