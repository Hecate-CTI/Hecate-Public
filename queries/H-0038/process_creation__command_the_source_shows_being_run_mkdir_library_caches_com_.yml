title: mkdir creating Library/Caches/com.apple.trustd cache path
id: e51d47ce-02a2-4175-a799-7609dd07aca5
status: experimental
description: Detects mkdir creating a path under Library/Caches/com.apple.trustd,
  observed in a macOS ClickFix stealer campaign where the loader staged tooling
  under a trustd-named cache directory. Correlate with Terminal/curl lineage.
references:
- https://www.huntress.com/blog/mac-crypto-draining-malware
author: hecate (source-reviewed)
date: "2026-11-25"
tags:
- attack.t1059.004
- attack.t1036.005
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: /mkdir
    CommandLine|contains: /Library/Caches/com.apple.trustd
  condition: selection
falsepositives:
- Legitimate software creating a similarly named cache directory
level: medium
hunt_id: H-0038
