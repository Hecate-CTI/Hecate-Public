title: Suspicious Payload or Script Creation by FortiClient FortiVRS Process
id: 2f687736-5d30-41dc-b80e-35e29b152209
status: experimental
description: Detects executable, script, or staging file creation by FortiVRS.exe (FortiPAM privileged session component). When exploited via CVE-2026-121529 local API CORS vulnerabilities to achieve code execution, adversaries may drop secondary payloads or scripts to disk. Filters out routine log, configuration, and database files to prevent false positives.
references:
- https://github.com/tc4dy/CVE-2026-121529-Toolkit
author: hecate analyst review
date: '2026-11-14'
tags:
- attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_process:
    Image|endswith: '\FortiVRS.exe'
  selection_target:
    TargetFilename|endswith:
    - .exe
    - .dll
    - .bat
    - .ps1
    - .vbs
    - .cmd
  condition: selection_process and selection_target
falsepositives:
- Legitimate FortiClient administrative updates or helper tool deployments
level: medium
hunt_id: H-0036
hecate_review:
  verdict: pass
  reviewed_by: analyst
  notes: >-
    Requires payload/script extensions (.exe/.dll/.bat/.ps1/.vbs/.cmd). Removed
    dead benign filters that could never match the target selection.
