# Public destination: restricted TLP material and credentials are blocked before upload.
# Quality issues, unfinished drafts, broken rules, and unvalidated hunts are permanently hard-blocked.
version: 1
target_visibility: public
auto_merge:
  enabled: true
  merge_method: squash
risk:
  missing_cti: block
  missing_research: block
  missing_sigma: block
  incomplete_metadata: block
  low_confidence_source: review
  unsupported_claims: block
  publish_check_failed: block
  # Live BAS miss only — skipped/mock BAS is optional and must not block publish.
  bas_failed: block
  unexecuted_hunt: block
  tlp_amber: block
  unknown_tlp: review
review:
  minimum_approvals: 1
  allowed_associations:
  - OWNER
  - MEMBER
  - COLLABORATOR
publisher_login: hecate-publisher[bot]
